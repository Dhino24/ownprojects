# Déploiement Netlify de Yoon (environnement de TEST en mode démo).
# Interface : dist-web · API : fonction netlify/functions/api.mts sur /api/*
# Base : Netlify Database (provisionnée grâce à @netlify/database) · Médias : Netlify Blobs.
[build]
  command = "node scripts/embed-migrations.mjs && npx vite build && node scripts/build-function.mjs"
  publish = "dist-web"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Fonction déjà assemblée en un seul fichier par scripts/build-function.mjs :
  # rien n'est résolu dans node_modules à l'exécution.
  directory = "netlify/functions-build"
  external_node_modules = ["pg-native"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
