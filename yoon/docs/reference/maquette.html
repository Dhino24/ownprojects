function intro(title,sub,action=''){return `<div class="between intro"><div><div class="eyebrow">Dakar, Sénégal &nbsp; / &nbsp; Mardi 10 novembre</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}function stat(label,value,sub,icon){return `<div class="stat"><div class="between"><small>${label}</small>${I(icon)}</div><div class="statvalue">${value}</div><small>${sub}</small></div>`}function delivery(o){return `<div class="delivery" tabindex="0" role="button" onclick="detail('${o.id}')" onkeydown="if(event.key==='Enter')detail('${o.id}')"><div class="between"><div class="flex"><div class="parcelicon">${I('box')}</div><div><b>${esc(o.name)}</b><small>#${o.id} · Aujourd’hui, ${o.time}</small></div></div><span class="tag ${o.status==='À attribuer'?'orange':''}">${o.status}</span></div><div class="route"><span>Mermoz</span>${I('arrow')}<span>${esc(o.to)}</span><b style="margin-left:auto;color:#475f44">${money(o.price)}</b></div></div>`}function list(){let list=orders.filter(o=>filter==='Toutes'||(filter==='En cours'?o.status!=='Livrée':o.status==='Livrée'));return `<div class="filters">${['Toutes','En cours','Livrées'].map(f=>`<button class="${filter===f?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div>${list.map(delivery).join('')||'<p style="padding:20px">Aucune livraison dans cette catégorie.</p>'}`}
function home(){return `${intro('Bonjour, Adama 👋','Une belle journée pour faire avancer vos livraisons.',btn('Nouvelle livraison',"step=1;go('new')",'primary','plus'))}<div class="grid"><div><section class="hero"><div class="heroContent"><span class="tag dark">VOTRE QUOTIDIEN, PLUS LÉGER</span><h2>Vous vendez.<br>On s’occupe du trajet.</h2><p>Un colis, un repère, et c’est parti.<br>Vos clients sont entre de bonnes mains.</p>${btn('Envoyer un colis',"step=1;go('new')",'primary lime')}</div><svg class="package" viewBox="0 0 160 160" aria-hidden="true"><path d="m20 48 58-25 61 26-60 28z" fill="#e4f4b8"/><path d="m20 48 59 29v63l-59-31z" fill="#b5cd8e"/><path d="m79 77 60-28v63l-60 28z" fill="#d0e6a6"/><path d="m50 35 61 28v32l-16 8V70L35 42z" fill="#6f8e5a"/><path d="m100 118 23-10 M100 123l15-7" stroke="#7a9664" stroke-width="3"/><rect x="32" y="73" width="26" height="28" rx="3" fill="#f5f8e4" transform="skewY(25) translate(0 -18)"/></svg></section><div class="stats">${stat('Livraisons du jour','12','↑ 3 de plus qu’hier','box')}${stat('En cours','03','Vos colis avancent','clock')}${stat('Frais de livraison','18 500 <span style="font-size:12px">F</span>','Aujourd’hui · FCFA','wallet')}</div><section class="card"><div class="cardhead between"><h2>Vos livraisons</h2><button class="textbtn" onclick="go('orders')">Tout voir ↗</button></div>${list()}</section></div><div class="rightcol"><section class="card"><div class="cardhead between"><h3>Votre livraison en direct</h3><span class="tag">#YN-2084</span></div>${map()}<div class="tracking"><div class="between"><div><small>Arrivée estimée</small><div class="eta">8 <small>minutes</small></div></div><span class="tag"><span class="dot"></span>En route</span></div><div class="progress"><span class="on"></span><span class="on"></span><span class="on"></span><span></span></div><div class="between"><small style="font-size:9px">Colis récupéré</small><small style="font-size:9px">Bientôt chez Aïssatou</small></div>${driver()}${btn('Suivre la livraison',"go('track')",'secondary trackbtn')}</div></section><section class="quick"><div class="flex">${I('pin')}<h3>Le bon repère change tout.</h3></div><p>Une photo, une position ou une note vocale.<br>Moins d’appels, plus de sérénité.</p><button class="textbtn" onclick="go('location')">Voir l’écran de localisation ↗</button></section></div></div>`}
function driver(){return `<div class="driver"><span class="avatar">MD</span><div><b>Mamadou Diouf</b><small>Votre livreur · Moto</small></div><button class="round" aria-label="Contacter Mamadou" onclick="modal('<h2>Contacter Mamadou</h2><p>Appel et discussion WhatsApp seront accessibles ici.</p><div class=notice>Contact simulé dans cette maquette.</div>')">${I('chat')}</button></div>`}
function detail(id){const o=orders.find(o=>o.id===id);if(id==='YN-2084'){go('track');return}modal(`<h2>Livraison #${o.id}</h2><span class="tag">${o.status}</span><div class="bill"><b>${esc(o.name)}</b><p>Mermoz → ${esc(o.to)}</p><b>${money(o.price)}</b></div><p class="muted">${o.status==='Livrée'?'Colis remis. Preuve de livraison validée.':'La position du client est reçue. Attribution manuelle en attente.'}</p>`)}function orderScreen(){return `${intro('Vos livraisons','Chaque colis, au bon endroit.',btn('Nouvelle livraison',"step=1;go('new')",'primary','plus'))}<div class="card">${list()}</div>`}
function newOrder(){return `${intro('Une livraison, en quelques gestes.','Les informations utiles. Rien de plus.')}<section class="card formcard"><div class="between"><button class="textbtn flex" onclick="${step>1?'step--;render()':"go('home')"}">${I('back')}Retour</button><small>Étape ${step} sur 3</small></div><div class="steps">${[1,2,3].map(s=>`<span class="${s<=step?'on':''}"></span>`).join('')}</div>${step===1?`<h2>À qui livre-t-on ?</h2><p class="muted">Le client pourra préciser sa position et ses repères.</p><form onsubmit="event.preventDefault();step=2;render()"><label class="field">Nom du client<input required placeholder="Ex. Aïssatou Diop" value="${esc(draft.name)}" oninput="draft.name=this.value" autocomplete="name"></label><label class="field">Téléphone WhatsApp<input required type="tel" pattern="[+0-9 ()-]{9,18}" placeholder="+221 77 000 00 00" value="${esc(draft.phone)}" oninput="draft.phone=this.value" autocomplete="tel"></label><label class="field">Montant de la commande (FCFA)<input required type="number" min="0" step="1" placeholder="Ex. 12 500" value="${esc(draft.amount)}" oninput="draft.amount=this.value"></label><button class="primary" style="width:100%">Continuer ${I('arrow')}</button></form>`:step===2?`<h2>D’où part le colis ?</h2><label class="field">Lieu de retrait<input value="${esc(draft.pickup)}" oninput="draft.pickup=this.value"></label><label class="field">Zone de livraison<select onchange="draft.zone=this.value">${['Ouakam','Almadies','Point E','Pikine','Guédiawaye','Rufisque','Keur Massar'].map(z=>`<option ${draft.zone===z?'selected':''}>${z}</option>`).join('')}</select></label><div class="notice">Le client recevra une demande de position avant l’attribution au livreur. Il pourra ajouter une photo, un repère ou une note vocale.</div><label class="field">Qui paie la livraison ?<select onchange="draft.payer=this.value"><option ${draft.payer==='Commerçant'?'selected':''}>Commerçant</option><option ${draft.payer==='Client'?'selected':''}>Client</option></select></label>${btn('Voir le récapitulatif',"if(!draft.pickup.trim()){toast('Indiquez le lieu de retrait.')}else{step=3;render()}",'primary trackbtn')}`:`<h2>Tout est prêt ?</h2><div class="bill"><div class="between"><span>Client</span><b>${esc(draft.name)}</b></div><div class="between"><span>Retrait</span><b>${esc(draft.pickup)}</b></div><div class="between"><span>Livraison</span><b>${esc(draft.zone)}</b></div><div class="between"><span>Commande</span><b>${money(Number(draft.amount))}</b></div><hr style="border:0;border-top:1px solid #dce5d4"><div class="between"><span>Prix de la course</span><b>${money(fare())}</b></div><small>À la charge du ${draft.payer.toLowerCase()} · tarif de démonstration par zone</small></div><div class="notice">Le paiement de la commande revient au commerçant. Le livreur ne manipule pas d’argent.</div>${btn('Confirmer la livraison',"confirmOrder()",'primary trackbtn','check')}`}</section>`}function fare(){return ({Ouakam:1500,Almadies:2000,'Point E':1000,Pikine:2500,Guédiawaye:3000,Rufisque:4000,'Keur Massar':3500})[draft.zone]}function confirmOrder(){orders.unshift({id:'YN-'+(2085+orders.length-3),name:draft.name,to:draft.zone,status:'À attribuer',time:'14:45',price:fare()});go('orders');toast('Livraison créée dans la maquette. Demande de position simulée.');draft={name:'',phone:'',zone:'Ouakam',pickup:'Ma boutique · Mermoz',amount:'',payer:'Commerçant'}}
function tracking(){return `${intro('Votre colis est en chemin.','Livraison #YN-2084 · Mermoz → Ouakam')}<div class="grid"><section class="card">${map()}<div class="tracking"><div class="between"><h2>Encore 8 minutes</h2><span class="tag">En route</span></div>${driver()}<div class="two">${btn('Contacter le livreur',"modal('<h2>Discussion WhatsApp</h2><p>Bonjour Mamadou, je suis devant la pharmacie.</p><div class=notice>Aucun message envoyé : écran de démonstration.</div>')",'secondary trackbtn','chat')}${btn('Signaler un problème','support()','secondary trackbtn','bell')}</div></div></section><section class="card"><div class="cardhead"><h2>Les étapes de votre colis</h2></div><div class="timeline"><div><b>Commande confirmée</b><small>14:20 · Boutique Adama</small></div><div><b>Position du client reçue</b><small>14:24 · Ouakam, près de la pharmacie</small></div><div><b>Colis récupéré</b><small>14:32 · Mamadou est en route</small></div><div style="opacity:.5"><b>Livraison au client</b><small>Remise contre code à 4 chiffres</small></div></div><div style="padding:0 23px 23px"><div class="notice">Repère : portail vert, en face de la pharmacie. Appelez à l’arrivée.</div></div></section></div>`}
function client(){return `${intro('Votre commande arrive, Aïssatou.','Un repère précis, une livraison tranquille.')}<div class="grid"><section class="card">${map()}<div class="tracking"><div class="between"><div><small>Votre livreur arrive dans</small><div class="eta">8 <small>minutes</small></div></div><span class="tag">En route</span></div>${driver()}${btn('Préciser ma position',"go('location')",'secondary trackbtn','pin')}</div></section><div><section class="card tracking"><span class="eyebrow">À LA REMISE DU COLIS</span><h2 style="margin-top:12px">Votre code de livraison</h2><div class="code">${'4826'.split('').map(n=>`<span>${n}</span>`).join('')}</div><p class="notice">Donnez ce code au livreur uniquement après avoir reçu votre commande.</p></section><section class="card tracking" style="margin-top:20px"><div class="between"><h3>Votre paiement</h3><span class="tag orange">${paid?'À vérifier':'À régler'}</span></div><div class="bill"><div class="between"><span>Commande</span><b>12 500 F</b></div><div class="between"><span>Livraison</span><b>1 500 F</b></div><div class="between"><b>Total</b><b>14 000 F</b></div></div>${btn(paid?'Voir le justificatif':'Choisir mon paiement',"go('payment')",'primary trackbtn','wallet')}</section></div></div>`}
function locationScreen(){return `${intro('Le bon endroit, du premier coup.','Aidez le livreur à vous trouver sans appels répétés.')}<section class="card formcard"><h2>Où vous retrouver ?</h2><p class="muted">Votre position et un repère suffisent.</p>${map()}${btn(located?'Position ajoutée · Ouakam':'Partager ma position',"located=true;render();toast('Position fictive ajoutée pour la démonstration.')",'primary trackbtn','location')}<label class="field">Un repère facile à reconnaître<textarea id="landmark" placeholder="Ex. Portail vert, en face de la pharmacie">${located?'Portail vert, en face de la pharmacie.':''}</textarea></label><div class="two">${btn('Ajouter une photo',"document.getElementById('photo').click()",'secondary','camera')}${btn('Note vocale',"modal('<h2>Un repère, avec vos mots.</h2><div class=code>▂ ▅ ▃ ▇ ▂ ▆ ▄</div><p>En face de la pharmacie, le portail vert.</p><div class=notice>Aperçu d’une note vocale. Aucun micro activé.</div>')",'secondary','mic')}</div><input id="photo" type="file" accept="image/*" hidden onchange="toast('Photo sélectionnée localement, sans envoi.')">${btn('Confirmer mon repère',"located=true;go('home');toast('Repère enregistré dans la démonstration.')",'primary trackbtn','check')}</section>`}
function paymentScreen(){return `${intro('Payez en toute simplicité.','Wave ou Orange Money. Aucun cash à remettre au livreur.')}<section class="card formcard"><h2>${paid?'Paiement en cours de vérification':'Choisissez votre moyen de paiement'}</h2><div class="bill"><div class="between"><span>Commande · Boutique Adama</span><b>12 500 F</b></div><div class="between"><span>Course · Yoon</span><b>1 500 F</b></div><div class="between"><b>Total à payer</b><b>14 000 F CFA</b></div></div>${['Wave','Orange Money'].map(p=>`<div class="payment ${pay===p?'chosen':''}" role="button" tabindex="0" onclick="pay='${p}';render()" onkeydown="if(event.key==='Enter'){pay='${p}';render()}"><span class="paylogo ${p==='Wave'?'':'om'}">${p==='Wave'?'≈':'O'}</span><b>${p}</b><span style="margin-left:auto">${pay===p?'●':'○'}</span></div>`).join('')}<div class="notice">La commande est payée au commerçant, la course au service. Les deux confirmations sont vérifiées manuellement pendant le pilote.</div>${paid?'<p class="tag orange" style="display:block;text-align:center;margin-top:20px">Justificatifs reçus · validation de l’équipe en attente</p>':btn('Voir les instructions',"paymentInstructions()",'primary trackbtn')}</section>`}
function courier(){return `${intro('Bonne route, Mamadou.','Des courses claires. Des clients faciles à trouver.')}<div class="grid"><div><section class="balance"><div class="between"><div><small>Votre disponibilité</small><h2 style="margin-top:9px">${available?'Vous êtes en ligne':'Vous êtes hors ligne'}</h2></div><button class="switch ${available?'on':''}" aria-label="Changer ma disponibilité" aria-pressed="${available}" onclick="available=!available;render()"><span></span></button></div><p style="font-size:12px;color:#bed0bc">${available?'Prêt à recevoir votre prochaine course.':'Activez votre disponibilité pour recevoir des courses.'}</p></section><section class="card offer">${completed?`<span class="tag">Course terminée</span><h2 style="margin-top:20px">Bien livré. Bien joué.</h2><p>Votre preuve de livraison est validée.</p>${btn('Voir mes gains',"go('wallet')")}`:accepted?`<span class="tag">Votre course</span><h2 style="margin:20px 0">Mermoz → Ouakam</h2><p>Votre client vous attend. Retrouvez ses repères et les étapes de la course.</p>${btn('Ouvrir la course',"go('mission')")}`:available?`<div class="between"><span class="tag">Nouvelle proposition</span><small>Offre · 30 secondes</small></div><div class="bigmoney">1 200 <span style="font-size:17px">F CFA</span></div><p class="muted">Votre gain pour cette course</p><div class="bill"><p><b>Retrait</b><br>Boutique Adama · Mermoz</p><p><b>Livraison</b><br>Aïssatou Diop · Ouakam</p><small>Position client reçue · aucun cash à encaisser</small></div><div class="two">${btn('Refuser',"available=false;render();toast('Offre refusée. Réactivez votre disponibilité pour la revoir.')",'secondary','back')}${btn('Accepter',"accepted=true;go('mission')",'primary','check')}</div><p class="muted" style="font-size:10px">Délai figé pour explorer la maquette.</p>`:`<h2>Une pause bien méritée.</h2><p class="muted">Aucune offre tant que vous êtes indisponible.</p>`}</section></div><div><section class="card">${map()}</section><div class="stats" style="grid-template-columns:1fr 1fr">${stat('Gains du jour',completed?'8 400 F':'7 200 F','À reverser','wallet')}${stat('Courses terminées',completed?'7':'6','Aujourd’hui','check')}</div></div></div>`}
function mission(){if(!accepted)return `${intro('Votre prochaine course','Acceptez une proposition pour retrouver les repères du client.')}<section class="card offer"><p>Aucune course active pour le moment.</p>${btn('Voir les propositions',"go('home')")}</section>`;if(completed)return `${intro('Livraison terminée','La preuve a été validée dans la maquette.')}<section class="card offer"><h2>1 200 F ajoutés à vos gains</h2>${btn('Voir mes gains',"go('wallet')",'primary trackbtn')}</section>`;return `${intro(picked?'Cap sur Ouakam.':'Récupérez le colis à Mermoz.','Course #YN-2084 · Votre gain : 1 200 F')}<div class="grid"><section class="card">${map()}<div class="tracking"><h2>${picked?'Aïssatou Diop · Ouakam':'Boutique Adama · Mermoz'}</h2><p class="notice">${picked?'Portail vert, en face de la pharmacie. Entrée côté rue.':'Colis prêt à l’accueil. Demandez Adama.'}</p><div class="two">${btn('Itinéraire',"toast('Ouverture de l’itinéraire simulée.')",'secondary','location')}${btn('Contacter',"modal('<h2>Contacter '+(picked?'Aïssatou':'Adama')+'</h2><p>Appel ou message WhatsApp en un geste.</p><div class=notice>Contact fictif.</div>')",'secondary','chat')}</div></div></section><section class="card offer"><h2>${picked?'Confirmer la remise':'Le colis est prêt ?'}</h2><p class="muted">${picked?'Demandez le code au client après lui avoir remis sa commande.':'Vérifiez le colis avec le commerçant avant de partir.'}</p>${!picked?btn('J’ai récupéré le colis',"picked=true;render()",'primary trackbtn','check'):`<form onsubmit="event.preventDefault();if(document.getElementById('otp').value==='4826'){completed=true;go('home');toast('Livraison confirmée.')}else{document.getElementById('codeError').textContent='Code incorrect. Réessayez avec le code de démonstration 4826.'}"><label class="field">Code du client<input id="otp" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="4 chiffres" style="font-size:27px;letter-spacing:12px"></label><small>Code de démonstration : 4826</small><p id="codeError" role="alert" style="color:#a6452e"></p><button class="primary trackbtn">Confirmer la livraison ${I('check')}</button></form>${btn('Client injoignable',"support()",'secondary trackbtn','chat')}`}</section></div>`}
function wallet(){return `${intro(role==='Livreur'?'Vos gains, en toute clarté.':'Vos paiements, au même endroit.','Récapitulatif du jour · montants de démonstration')}<div class="grid"><div><section class="balance"><small>${role==='Livreur'?'Solde à vous reverser':'Frais de livraison du jour'}</small><div class="bigmoney">${role==='Livreur'?(completed?'8 400':'7 200'):'18 500'} <span style="font-size:18px">F CFA</span></div><span class="tag dark">${role==='Livreur'?'Reversement suivi par l’équipe':'12 livraisons aujourd’hui'}</span></section><section class="card"><div class="cardhead"><h2>Derniers mouvements</h2></div>${orders.map(o=>`<div class="delivery between"><div><b>#${o.id}</b><small>${o.to} · ${o.time}</small></div><b>${money(role==='Livreur'?1200:o.price)}</b></div>`).join('')}</section></div><section class="card tracking"><h2>${role==='Admin'?'Vérifications en attente':'Votre récapitulatif'}</h2><p class="muted">Les paiements et reversements sont suivis manuellement pendant le pilote.</p><div class="bill"><div class="between"><span>Wave</span><b>12 500 F</b></div><div class="between"><span>Orange Money</span><b>6 000 F</b></div></div>${role==='Admin'?btn('Vérifier les justificatifs',"reviewPayment()",'primary trackbtn','check'):btn('Voir le récap WhatsApp',"modal('<h2>Récapitulatif du jour</h2><p>12 livraisons effectuées.<br>18 500 F de frais de livraison.<br>Merci et à demain !</p><div class=notice>Aperçu du message, sans envoi.</div>')",'secondary trackbtn','chat')}</section></div>`}
function admin(){return `${intro('Tout Dakar, en un regard.','Attribuez les courses et gardez le fil des opérations.')}<div class="stats">${stat('Courses à attribuer',orders.filter(o=>o.status==='À attribuer').length.toString(),'Action requise','box')}${stat('Livreurs disponibles','08','Dans la région de Dakar','user')}${stat('Paiements à vérifier','02','Contrôle manuel','wallet')}</div><section class="card"><div class="cardhead between"><h2>Centre des opérations</h2><span class="tag"><span class="dot"></span>Vue de démonstration</span></div><div class="tablewrap"><table><thead><tr><th>COURSE</th><th>DESTINATAIRE</th><th>TRAJET</th><th>STATUT</th><th>ACTION</th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>#${o.id}</b></td><td>${esc(o.name)}</td><td>Mermoz → ${esc(o.to)}</td><td><span class="tag ${o.status==='À attribuer'?'orange':''}">${o.status}</span></td><td>${o.status==='À attribuer'?`<button class="textbtn" onclick="assign('${o.id}')">Attribuer ↗</button>`:`<button class="textbtn" onclick="detail('${o.id}')">Voir ↗</button>`}</td></tr>`).join('')}</tbody></table></div></section><div class="two" style="margin-top:20px"><section class="card tracking"><h3>Livreurs disponibles</h3>${['Mamadou Diouf · Mermoz','Ibrahima Fall · Ouakam','Cheikh Ba · Point E'].map(n=>`<div class="driver"><span class="avatar">${n.split(' ').map(w=>w[0]).slice(0,2).join('')}</span><b>${n}</b><span class="tag" style="margin-left:auto">Disponible</span></div>`).join('')}</section><section class="card tracking"><h3>À surveiller</h3><p class="notice">YN-2083 · Paiement en attente de vérification.</p><p class="notice">La position client doit être reçue avant toute offre au livreur.</p>${btn('Suivre les paiements',"go('wallet')",'secondary trackbtn','wallet')}</section></div>`}
function assign(id){modal(`<h2>Attribuer #${id}</h2><p class="tag">Position client reçue</p><label class="field">Livreur disponible<select id="driver"><option>Mamadou Diouf · Mermoz</option><option>Ibrahima Fall · Ouakam</option><option>Cheikh Ba · Point E</option></select></label><div class="notice">L’offre est valable 30 secondes. Sans réponse, proposez-la au livreur suivant.</div>${btn('Envoyer la proposition',`orders.find(o=>o.id==='${id}').status='Offre envoyée';closeModal();render();toast('Offre simulée envoyée au livreur.')`,'primary trackbtn')}`)}function zones(){return `${intro('Un prix clair, avant le départ.','Tarification fixe par paire de zones · exemples à valider sur le terrain')}<section class="card"><div class="tablewrap"><table><thead><tr><th>RETRAIT</th><th>DESTINATION</th><th>TARIF (FCFA)</th></tr></thead><tbody>${[['Ouakam',1500],['Almadies',2000],['Point E',1000],['Pikine',2500],['Guédiawaye',3000],['Rufisque',4000],['Keur Massar',3500]].map(([z,p])=>`<tr><td>Mermoz</td><td>${z}</td><td><b>${money(p)}</b></td></tr>`).join('')}</tbody></table></div></section>`}
function profile(){return `${intro('Votre espace, simplement.','Boutique Adama · Mermoz, Dakar')}<section class="card formcard"><div class="flex"><span class="avatar" style="width:60px;height:60px;font-size:20px">AF</span><div><h2>Adama Fall</h2><p class="muted" style="margin:4px 0">Commerçant partenaire</p></div></div><div class="bill"><div class="between"><span>Langue de la maquette</span><b>Français</b></div><div class="between"><span>Zone de retrait</span><b>Mermoz</b></div></div><p class="notice">Des notes vocales peuvent accompagner les repères. L’interface wolof reste à traduire et à valider avant le pilote.</p><div class="sources"><h3>Références de la direction UI</h3><p class="muted">Inspiration visuelle, composants recréés pour cette maquette.</p><a href="https://github.com/shadcn-ui/ui" target="_blank" rel="noopener">shadcn/ui <small> · sobriété, hiérarchie, contrôles accessibles</small> ↗</a><a href="https://github.com/magicuidesign/magicui" target="_blank" rel="noopener">Magic UI <small> · transitions et détails animés</small> ↗</a><a href="https://github.com/DavidHDev/react-bits" target="_blank" rel="noopener">React Bits <small> · interactions visuelles</small> ↗</a></div></section>`}
function paymentInstructions(){modal(`<h2>Payer avec ${pay}</h2><p>1. Régler 12 500 F au commerçant.<br>2. Régler 1 500 F au service.<br>3. Joindre les confirmations dans WhatsApp.</p><div class="notice">Aucun transfert réel dans ce prototype.</div><button class="primary trackbtn" onclick="simulatePayment()">Simuler les justificatifs</button>`)}
function simulatePayment(){paid=true;closeModal();render();toast('Justificatifs simulés : vérification en attente.')}
function reviewPayment(){modal(`<h2>Justificatifs · YN-2083</h2><p>Aucun justificatif réel chargé. Vérifiez le transfert reçu avant validation.</p><button class="primary" onclick="closeModal();toast('Validation fictive effectuée.')">Simuler la validation</button>`)}
render();
</script></body></html>
