# Déploiement de TEST de Yoon sur Render (render.com › New › Blueprint).
# Environnement de démonstration : données fictives, aucun paiement ni message réel.
# Ne pas utiliser tel quel pour le pilote (voir yoon/docs/PRODUCTION.md).
services:
  - type: web
    name: yoon-demo
    runtime: node
    rootDir: yoon
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: node dist-server/server/scripts/seed-demo.js && node dist-server/server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: development
      - key: DEMO_MODE
        value: "true"
      - key: SERVE_WEB
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yoon-db
          property: connectionString
databases:
  - name: yoon-db
    plan: free
    region: frankfurt
